# Generated by `npm run pinterest` in the site builder: edit scripts/pinterest.yml there instead.
# Every morning, adds the day's pins to the Pinterest feeds in pinterest/ and publishes them.
name: Pinterest pins
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node pinterest/release.mjs
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add pinterest/*.xml
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Release today's Pinterest pins"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
