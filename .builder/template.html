<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Page template: `npm run sync` fills in the {{…}} parts and writes one copy per page (see core/prerender.mjs). -->
  <base href="{{BASE}}" />
{{HEAD}}
  <link rel="icon" href="{{FAVICON}}" />
  <link rel="stylesheet" href="styles.css" />
{{THEME}}
  <link rel="stylesheet" href="custom.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{BASE}}" id="brand">{{BRAND}}</a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">☰</button>
    <nav class="nav" id="nav">{{NAV}}</nav>
  </header>

  <main class="main" id="main" data-prerendered="{{PATH}}">{{MAIN}}</main>

  <footer class="footer" id="footer"></footer>

  <!-- Order matters: config and content first, then the shared code, then this site's own additions. -->
  <script src="products.js"></script>
  <script src="site.config.js"></script>
  <script src="content.js"></script>
  <script src="render.js"></script>
  <script src="blocks.js"></script>
  <script src="custom.js"></script>
  <script src="app.js"></script>
</body>
</html>
